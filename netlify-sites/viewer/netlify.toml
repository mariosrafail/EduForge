[build]
  command = "npm run build:netlify:ultimate-b2-interactive"
  publish = "dist-netlify/ultimate-b2-interactive"
  ignore = "node ./scripts/netlify/ignore-site-build.mjs ultimate-b2-interactive"

[build.environment]
  HHPLMS_NETLIFY_REVIEW_TARGET = "viewer"

[functions]
  directory = "netlify-sites/viewer/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/preview/content/*"
  to = "https://hhplms-builder.netlify.app/builder/preview/content/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/preview/open-response-import/*"
  to = "https://hhplms-builder.netlify.app/builder/preview/open-response-import/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/preview/open-response-teacher/*"
  to = "https://hhplms-builder.netlify.app/builder/preview/open-response-teacher/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/preview/open-response-assets/*"
  to = "https://hhplms-builder.netlify.app/builder/preview/open-response-assets/:splat"
  status = 200
  force = true
