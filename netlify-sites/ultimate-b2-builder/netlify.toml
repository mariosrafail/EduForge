[build]
  command = "npm run build:netlify:ultimate-b2-builder"
  publish = "dist-netlify/ultimate-b2-builder"
  ignore = "node ./scripts/netlify/ignore-site-build.mjs ultimate-b2-builder"

[build.environment]
  HHPLMS_NETLIFY_REVIEW_TARGET = "ultimate-b2-builder"

[functions]
  directory = "netlify-sites/ultimate-b2-builder/functions"

[[redirects]]
  from = "/builder/api/auth"
  to = "/.netlify/functions/builder-auth"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/content/*"
  to = "/.netlify/functions/builder-content/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/preview-authorization"
  to = "/.netlify/functions/builder-preview-authorization"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/native-activities/*"
  to = "/.netlify/functions/builder-native-activities/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/open-response-import/*"
  to = "/.netlify/functions/builder-open-response-import/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/ui-assets/*"
  to = "/.netlify/functions/builder-teacher-ui-assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/api/publication/*"
  to = "/.netlify/functions/builder-publication/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/native-activities/*"
  to = "/.netlify/functions/builder-native-preview/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/releases/*"
  to = "/.netlify/functions/builder-publication/preview/releases/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/content/*"
  to = "/.netlify/functions/builder-preview/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/open-response-import/*"
  to = "/.netlify/functions/builder-open-response-import/preview/open-response-import/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/open-response-teacher/*"
  to = "/.netlify/functions/builder-open-response-import/preview/open-response-teacher/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/open-response-assets/*"
  to = "/.netlify/functions/builder-open-response-import/preview/open-response-assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/builder/preview/ui-assets/*"
  to = "/.netlify/functions/builder-teacher-ui-assets/preview/ui-assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/ultimate-b2-builder.html"
  status = 200
