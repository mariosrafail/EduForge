<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Discussion ideas for film, theatre and television</title>
  <desc id="description">Three landscape cards: favourite entertainment, how often you watch, and where you watch.</desc>
  <rect width="1200" height="460" rx="30" fill="#eff9fc"/>
  <rect x="24" y="24" width="1152" height="412" rx="24" fill="#fff" stroke="#b6d8e4" stroke-width="4"/>
  <text x="600" y="92" text-anchor="middle" font-family="Fira Sans, Arial, sans-serif" font-size="39" font-weight="800" fill="#172033">Discuss these ideas</text>
  <g font-family="Fira Sans, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(70 135)">
      <rect width="320" height="230" rx="22" fill="#eaf3ff" stroke="#8bb7ff" stroke-width="3"/>
      <circle cx="160" cy="70" r="34" fill="#175cd3"/>
      <path d="M148 55h24v30h-24zM139 62h42M139 78h42" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <text x="160" y="139" font-size="25" font-weight="800" fill="#172033">Your favourite form</text>
      <text x="160" y="174" font-size="25" font-weight="800" fill="#172033">of entertainment</text>
    </g>
    <g transform="translate(440 135)">
      <rect width="320" height="230" rx="22" fill="#fff6e5" stroke="#f3bd43" stroke-width="3"/>
      <circle cx="160" cy="70" r="34" fill="#e9a400"/>
      <path d="M160 48v24l17 10M160 42v7" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
      <text x="160" y="139" font-size="25" font-weight="800" fill="#172033">How often you watch</text>
      <text x="160" y="174" font-size="23" font-weight="700" fill="#334155">films, plays and TV</text>
    </g>
    <g transform="translate(810 135)">
      <rect width="320" height="230" rx="22" fill="#f7edfa" stroke="#bd83ca" stroke-width="3"/>
      <circle cx="160" cy="70" r="34" fill="#812990"/>
      <path d="M144 59h32v22h-32zM151 87h18M160 81v6" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="160" y="139" font-size="25" font-weight="800" fill="#172033">Where you watch</text>
      <text x="160" y="174" font-size="25" font-weight="800" fill="#172033">them</text>
    </g>
  </g>
</svg>
