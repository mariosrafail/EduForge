name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:migration-manifest
      - run: npm run audit:runtime-schema-boundary
      - run: npm test
      - run: npm run test:teacher-project-builder
      - run: npm run audit:source-structure
      - run: npm run audit:branding
      - run: npm run test:book-builder:studio
      - run: npm run build:book-builder
      - run: npm run verify:book-builder-bundle-safety
      - run: npm run build
      - run: npm run verify:web-bundle-safety
      - run: npm run build:android-offline
      - run: npm run verify:android-student-bundle-safety
      - run: npm run build:android-teacher-offline
      - run: npx playwright install --with-deps chromium
      - run: npm run build:netlify:ultimate-b2-builder
      - run: npm run verify:netlify:ultimate-b2-builder
      - name: Run unified Builder Review and native Viewer acceptance
        run: npm run test:builder:hosted-native-activity
      - run: npm run build:netlify:ultimate-b2-interactive
      - run: npm run verify:netlify:ultimate-b2-interactive
      - run: npm run test:viewer:boundary
      - name: Run publication readiness and immutable Review acceptance
        run: npm run test:builder:publication
      - run: node scripts/book-builder/teacher-project-authoring-playwright.mjs
      - run: npm run test:book-builder:studio:visual
      - run: npm run test:android-teacher-offline:smoke
      - run: npm run test:android-teacher-offline:intro
      - run: npm run test:android-teacher-offline:viewports
      - run: npm run test:ultimate-b2:legacy-pilot:assets
      - run: npm run test:ultimate-b2:legacy-pilot:visual
      - run: npm run test:ultimate-b2:legacy-pilot:modes
      - run: npm run verify:android-teacher-media
      - run: npm audit --audit-level=high

  android-debug-builds:
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: chmod +x android/gradlew
      - name: Assemble existing Android offline debug APK
        run: npm run android:build
      - name: Assemble and verify teacher classroom debug APK
        run: npm run android:teacher:build
      - name: Assemble and verify generic Teacher Project debug APK
        env:
          TEACHER_PROJECT_REAL_APK: "1"
        run: node --test tests/teacher-project-real-apk.test.js

  integration-database:
    needs: unit-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hhplms_test
          POSTGRES_PASSWORD: hhplms_test
          POSTGRES_DB: hhplms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hhplms_test -d hhplms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://hhplms_test:hhplms_test@localhost:5432/hhplms_test
      TEST_DATABASE_CONFIRMATION: isolated-test-database
      AUTH_RATE_LIMIT_SALT: isolated-ci-ordinary-auth-rate-limit-only
      PLATFORM_ADMIN_RATE_LIMIT_SALT: isolated-ci-platform-admin-rate-limit-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated PostgreSQL integration tests
        run: npm run test:integration
      - name: Remove temporary integration schemas
        if: always()
        run: npm run test:integration:cleanup

  deploy-cloudflare-builder:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [unit-and-build, android-debug-builds, integration-database]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: cloudflare-builder-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify exact workflow commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: npm run build:cloudflare:builder
      - run: npm run verify:cloudflare:builder
      - name: Preflight Cloudflare Builder staging R2 permission
        run: npm run preflight:cloudflare:builder-media
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Synchronize Cloudflare Player staging media
        run: npm run sync:cloudflare:builder-media
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Cloudflare Builder staging
        run: npx --no-install wrangler deploy --config cloudflare/builder/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
