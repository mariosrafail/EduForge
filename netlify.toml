[build]
  command = "npm run deploy:build"
  publish = "dist"
  functions = "netlify/functions"
  ignore = "node ./scripts/netlify/ignore-site-build.mjs lms"

[dev]
  command = "node scripts/start-vite-loopback.mjs"
  targetPort = 8001
  port = 8888
  publish = "dist"

[[redirects]]
  from = "/platform-admin/api/auth"
  to = "/.netlify/functions/platform-admin-auth"
  status = 200
  force = true

[[redirects]]
  from = "/platform-admin/api/control"
  to = "/.netlify/functions/platform-admin"
  status = 200
  force = true

[[redirects]]
  from = "/platform-admin/*"
  to = "/platform-admin/index.html"
  status = 200
  force = true
